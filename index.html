<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel-Sammler</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #2563eb; --ok: #10b981; --danger: #ef4444; --gold: #f59e0b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); max-width: 600px; margin-inline: auto; }
    h1 { font-size: 1.35rem; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 0.8rem; background: var(--accent); padding: 3px 10px; border-radius: 999px; }
    .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.95rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 14px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .btn-export { background: var(--ok); color: #052e16; }
    .btn-clear { background: transparent; border: 1px solid #475569; color: var(--muted); font-size: 0.85rem; padding: 8px; margin-top: 10px; }
    .btn-search { background: #334155; color: #e2e8f0; font-size: 0.78rem; padding: 7px 6px; margin-top: 6px; }
    .btn-small { background: #334155; color: #e2e8f0; width: auto; padding: 4px 8px; margin: 0; font-size: 0.78rem; }
    .btn-del { background: transparent; color: var(--danger); width: auto; padding: 4px 8px; margin: 0; font-size: 0.85rem; }
    .status { font-size: 0.85rem; color: #38bdf8; margin-top: 10px; min-height: 1.2em; word-break: break-word; }
    .chooser { margin-top: 10px; padding: 10px; border: 1px solid var(--gold); border-radius: 10px; background: rgba(245, 158, 11, 0.06); }
    .chooser-msg { font-size: 0.85rem; color: var(--gold); margin-bottom: 4px; }
    .btn-choice { background: #334155; color: var(--text); text-align: left; font-size: 0.9rem; padding: 10px; margin-top: 8px; }
    .btn-choice-warn { background: transparent; border: 1px dashed #475569; }
    .chooser-sub { display: block; font-weight: 400; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .item { border-bottom: 1px solid #334155; padding: 12px 0; font-size: 0.9rem; }
    .item:last-child { border-bottom: none; }
    .item.winner { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-weight: 600; }
    .score-pill { display: inline-block; background: #0f172a; border: 1px solid #38bdf8; color: #38bdf8; font-size: 0.75rem; padding: 2px 7px; border-radius: 999px; margin-top: 4px; }
    .tie-pill { display: inline-block; font-size: 0.72rem; color: var(--muted); border: 1px dashed #475569; padding: 1px 7px; border-radius: 999px; margin-top: 4px; font-weight: 400; }
    .deal-pill { display: inline-block; font-size: 0.72rem; color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.5); padding: 1px 7px; border-radius: 999px; margin-top: 4px; font-weight: 400; }
    .winner .score-pill { border-color: var(--gold); color: var(--gold); }
    .meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.4; }
    .attribution { color: var(--muted); font-size: 0.72rem; text-align: center; line-height: 1.5; margin: 4px 0 16px; }
    .attribution a { color: var(--muted); }
    .chooser-manual { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #475569; }
    .check-label { display: flex; align-items: center; gap: 8px; color: var(--text); margin-top: 12px; }
    .check-label input { width: auto; }
    .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin: 14px 0 2px; border-top: 1px solid #334155; padding-top: 10px; }
  </style>
</head>
<body>
  <h1>🏨 Hotel-Sammler <span class="badge" id="countBadge">0</span></h1>

  <form id="hotelForm" class="card">
    <input type="hidden" id="editIndex" value="-1" />

    <label for="url">Hotel-Link (Check24, TUI etc.)</label>
    <input type="url" id="url" placeholder="https://urlaub.check24.de/... oder https://www.tui.com/..." required />

    <label for="hotelName">Hotelname (für OSM & Portal-Suche)</label>
    <input type="text" id="hotelName" placeholder="z. B. The Grand Resort" required />

    <label for="location">Ort / Region (Auswahl oder Freitext)</label>
    <input type="text" id="location" list="locationPresets" placeholder="Auswählen oder eintippen..." required />
    <datalist id="locationPresets">
      <option value="Side, Türkei"></option>
      <option value="Hurghada, Ägypten"></option>
    </datalist>

    <div class="row">
      <div>
        <label for="price">Gesamtpreis (€)</label>
        <input type="number" id="price" placeholder="2450" />
      </div>
      <div>
        <label for="price2">Preis 2. Veranstalter (€)</label>
        <input type="number" id="price2" placeholder="optional" />
      </div>
    </div>

    <label for="board">Verpflegung</label>
    <select id="board">
      <option value="All Inclusive">All Inclusive</option>
      <option value="Halbpension">Halbpension</option>
      <option value="Frühstück">Frühstück</option>
      <option value="Ohne Verpflegung">Ohne Verpflegung</option>
    </select>

    <div class="section-title">Portal-Bewertungen & Schnellsuche</div>
    <div class="row" style="grid-template-columns: 1fr 1fr; margin-bottom: 4px;">
      <button type="button" class="btn-search" onclick="openPortalSearch('c24')">🔍 CHECK24 suchen</button>
      <button type="button" class="btn-search" onclick="openPortalSearch('tui')">🔍 TUI suchen</button>
    </div>
    <div class="row-3">
      <button type="button" class="btn-search" onclick="openPortalSearch('google')">🔍 Google</button>
      <button type="button" class="btn-search" onclick="openPortalSearch('hc')">🔍 HolidayCheck</button>
      <button type="button" class="btn-search" onclick="openPortalSearch('ta')">🔍 TripAdvisor</button>
    </div>

    <div class="row" style="margin-top: 10px;">
      <div>
        <label for="rateC24">CHECK24 (1–10)</label>
        <input type="text" inputmode="decimal" id="rateC24" placeholder="9.2 oder 9,2" />
      </div>
      <div>
        <label for="rateTUI">TUI (1–5)</label>
        <input type="text" inputmode="decimal" id="rateTUI" placeholder="4.5 oder 4,5" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="rateGoogle">Google (1–5)</label>
        <input type="text" inputmode="decimal" id="rateGoogle" placeholder="4.6 oder 4,6" />
      </div>
      <div>
        <label for="rateTA">TripAdvisor (1–5)</label>
        <input type="text" inputmode="decimal" id="rateTA" placeholder="4.5 oder 4,5" />
      </div>
    </div>

    <label for="rateHC">HolidayCheck (% Empf. oder Note 1–6)</label>
    <input type="text" inputmode="decimal" id="rateHC" placeholder="92 oder 5,4" />

    <div class="section-title">Eigene Eindrücke & Strand</div>
    <div class="row">
      <div>
        <label for="rating">Eigene Bewertung</label>
        <select id="rating">
          <option value="5">⭐⭐⭐⭐⭐ (5)</option>
          <option value="4.5">⭐⭐⭐⭐½ (4,5)</option>
          <option value="4" selected>⭐⭐⭐⭐ (4)</option>
          <option value="3">⭐⭐⭐ (3)</option>
          <option value="2">⭐⭐ (2)</option>
          <option value="1">⭐ (1)</option>
        </select>
      </div>
      <div>
        <label for="playground">Spielplatz (Metainfo)</label>
        <select id="playground">
          <option value="Ja">Ja</option>
          <option value="Nein">Nein</option>
          <option value="Unbekannt" selected>Unbekannt</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="beachType">Strand-Art</label>
        <select id="beachType">
          <option value="Sand">Sand (Top)</option>
          <option value="Sand/Kies">Sand/Kies-Mix</option>
          <option value="Kies">Kies / Stein</option>
          <option value="Steg/Plattform">Steg / Plattform</option>
          <option value="Unbekannt" selected>Unbekannt</option>
        </select>
      </div>
      <div>
        <label for="beachShade">Strand-Schatten</label>
        <select id="beachShade">
          <option value="Überdachung">Überdachung (Top)</option>
          <option value="Beides">Überdachung & Schirme</option>
          <option value="Schirme">Sonnenschirme</option>
          <option value="Keine/Unbekannt" selected>Keine / Unbekannt</option>
        </select>
      </div>
    </div>

    <label for="travelDate">Reisezeitraum</label>
    <input type="text" id="travelDate" placeholder="z. B. Sep 2026" />

    <label for="notes">Notiz (Pools, Rutschen, Transfer...)</label>
    <textarea id="notes" rows="2" placeholder="Kurze Notiz..."></textarea>

    <label id="relocateWrap" class="check-label" hidden>
      <input type="checkbox" id="relocate" /> Standort neu suchen (z. B. falscher OSM-Treffer)
    </label>

    <button type="submit" class="btn-primary" id="saveBtn">OSM prüfen & im Ranking speichern</button>
    <div class="status" id="status"></div>
    <div class="chooser" id="placeChooser" hidden></div>
  </form>

  <div class="card">
    <button type="button" class="btn-export" id="exportBtn">📤 Ranking-CSV an OneDrive senden</button>
    <button type="button" class="btn-clear" id="envAllBtn">🏘️ Fehlende Umgebungsdaten ergänzen</button>
    <div id="envAllStatus" class="chooser-sub"></div>
    <button type="button" class="btn-clear" id="importBtn">📥 Ranking-CSV importieren</button>
    <input type="file" id="importFile" accept=".csv,text/csv" hidden />
    <button type="button" class="btn-clear" id="clearAllBtn">🗑️ Gespeicherte Liste komplett leeren</button>
    <div id="hotelList" style="margin-top: 14px;"></div>
  </div>

  <footer class="attribution">
    Kartendaten © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap-Mitwirkende</a> (ODbL)<br />
    Geocoding: <a href="https://nominatim.org/" target="_blank" rel="noopener">Nominatim</a> &amp; <a href="https://photon.komoot.io/" target="_blank" rel="noopener">Photon</a> (Komoot) ·
    Routing: <a href="https://project-osrm.org/" target="_blank" rel="noopener">OSRM</a> (Server: <a href="https://www.fossgis.de/" target="_blank" rel="noopener">FOSSGIS</a>) ·
    Umgebung: <a href="https://overpass-api.de/" target="_blank" rel="noopener">Overpass API</a> ·
    Meeresabstand: <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>
  </footer>

  <script>
    (function fillFromShare() {
      const params = new URLSearchParams(window.location.search);
      const rawTitle = params.get('title') || '';
      const rawText = params.get('text') || '';
      const rawUrl = params.get('url') || '';

      const combinedUrl = rawUrl || [rawTitle, rawText].join(' ').match(/https?:\/\/[^\s]+/i)?.[0] || '';
      if (combinedUrl) {
        document.getElementById('url').value = combinedUrl;
      }

      // 1. HARDCODED CHECK24 PARSER: Check24 liefert den Namen meist direkt und sauber im Titel
      if (combinedUrl.includes('check24') || combinedUrl.includes('c.24.de') || rawTitle.toLowerCase().includes('check24')) {
        let cleanC24Name = rawTitle
          .replace(/bei CHECK24.*/i, '')
          .replace(/CHECK24.*/i, '')
          .replace(/Schau dir dieses Hotel an[:\s]*/i, '')
          .trim();
        
        if (cleanC24Name) {
          document.getElementById('hotelName').value = cleanC24Name;
          return;
        }
      }

      // 2. TUI URL PARSER
      if (combinedUrl.includes('tui.com')) {
        const tuiMatch = combinedUrl.match(/\/angebote\/([^\/?#]+)/i) || combinedUrl.match(/\/hotels\/([^\/?#]+)/i);
        if (tuiMatch && tuiMatch[1]) {
          document.getElementById('hotelName').value = tuiMatch[1].replace(/-/g, ' ').trim();
          return;
        }
      }

      // 3. Fallback für alles andere
      let candidate = (rawTitle || rawText)
        .replace(/https?:\/\/[^\s]+/gi, ' ')
        .trim();
      if (candidate) {
        document.getElementById('hotelName').value = candidate;
      }
    })();

    function openPortalSearch(portal) {
      const name = document.getElementById('hotelName').value.trim();
      const loc = document.getElementById('location').value.trim();
      if (!name) {
        alert('Bitte zuerst einen Hotelnamen eingeben.');
        return;
      }
      const query = encodeURIComponent(`${name} ${loc}`.trim());
      let url = `https://www.google.com/search?q=${query}+bewertung`;
      if (portal === 'c24') url = `https://www.google.com/search?q=site:check24.de+${query}`;
      if (portal === 'tui') url = `https://www.google.com/search?q=site:tui.com+${query}`;
      if (portal === 'hc') url = `https://www.google.com/search?q=site:holidaycheck.de+${query}`;
      if (portal === 'ta') url = `https://www.google.com/search?q=site:tripadvisor.de+${query}`;
      window.open(url, '_blank');
    }

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (confirm('Wirklich alle gespeicherten Hotels aus der App löschen?')) {
        localStorage.removeItem('saved_hotels_v1');
        if (typeof renderList === 'function') renderList();
      }
    });
  </script>
  <script src="./app.js?v=27"></script>
</body>
</html>
